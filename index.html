else if(scr=='patch')h=`<div class="ttl">Patch notes</div><div class="pt"><h3><span>v0.30 · Le désert</span></h3><ul><li><b>Touches</b> : F12 = plein écran (et pour le quitter), F11 = fenêtre étendue sur la page. Le <b>Lobby</b> est dans la liste des cartes. Tchat fermé : <b>Y</b> / <b>Entrée</b> l’ouvre, un second appui permet d’écrire. En multijoueur, l’encadré « niveau : pseudo » est visible sous chaque joueur.</li><li><b>Nouvelle carte « Lobby »</b> : l’intérieur d’un abri, sans zombies, pour discuter. « Jouer en ligne » et « Jouer en solo » y mènent directement. Le bouton <b>▶ Jouer</b> (minimap, en bas à droite) ouvre une fenêtre de sélection de carte ; en ligne, chaque carte a sa propre salle.</li><li>Le <b>menu pause</b> gagne un bouton <b>Wiki</b> et un bouton <b>Retour au lobby</b> (absent quand on est déjà au lobby). La fenêtre de tchat est un peu plus petite.</li><li>Le bouton <b>▶ Jouer</b> reste accessible en partie pour quitter la partie en cours et rejoindre une autre carte ; la liste des cartes indique le nombre de joueurs présents sur chacune.</li><li><b>Spectateur</b> : le bouton est inactif quand on est seul dans la partie. Un spectateur ne peut plus revenir avant la prochaine partie, et rejoindre une partie déjà commencée = spectateur jusqu’à la prochaine partie. Un joueur mort réapparaît toujours (50 % de PV) au début de la vague suivante, y compris en invasion.</li><li><b>Tableau des scores</b> : maintenez <b>Tab</b> en partie pour voir les joueurs, leurs zombies tués et leurs morts. À la fin de la partie, un tableau récapitulatif s’affiche avec trois boutons : <b>Rejouer</b> (même map), <b>Retour au lobby</b> et <b>Retour à l’accueil</b>.</li><li>Le bouton <b>pause</b> ⏸ rejoint les boutons personnages et compétences, en bas à droite (il est le plus à droite).</li><li><b>Nouvelle carte « Le désert »</b> : un peu plus petite que la Route 67, 15 vagues avec des zombies propres à la carte, et un boss : le caravanier. Elle a aussi sa version Invasion.</li><li><b>Nouveaux zombies</b> : le nomade, le marchand (appelle des nomades), le pillard (cible toujours le joueur le plus proche et l’immobilise), le ferrailleur (libère 2 pillards en mourant) et le soldat du désert (devient invisible et invincible 5 s). Le caravanier invoque des hordes de pillards.</li><li><b>Nouvelles armes</b> : XM1014 (fusil à pompe, rechargement cartouche par cartouche), M4A4 et AWP (perforation illimitée).</li><li><b>Nouvel équipement : le café</b> : +10 % de dégâts pendant 7 s, durées cumulables, 3 par vague maximum, deux fois plus rare que la boisson énergisante.</li><li><b>Recul</b> : un zombie touché recule légèrement, d’autant plus que l’arme a un fort tremblement (Léger, Moyen ou Fort). L’armurerie affiche maintenant le « Recul » au lieu du « Tremblement ».</li><li><b>Accueil</b> : les fenêtres « Boss vaincus » et « Vague max » laissent la place à un bouton « Record » qui sépare les cartes normales et les invasions.</li><li><b>Invasions</b> : une carte Invasion ne se débloque qu’après avoir terminé une fois la carte normale correspondante.</li><li><b>8 nouveaux personnages</b> : Abdul (accès au désert), Joseph, Dio et Jotaro (Le désert) ; Veilleur, Patrouilleur, Kakyoin et JP (invasions). « Compléter la vague N » en invasion = atteindre la vague N+1.</li><li>Barre d’interface : le niveau est affiché en grand à gauche, et les munitions du chargeur en grand à droite des barres, avec une petite icône de balle. Les barres de vie, de bouclier et d’XP sont plus fines, avec leurs chiffres à droite.</li><li><b>Mini-carte</b> : trois compteurs à icônes (joueurs en vie, zombies en vie, spectateurs) ; les compteurs « zombies tués » et « zombies » de la barre sont retirés. En multijoueur, boutons « Jouer » / « Spectateur » : le changement se fait à la fin de la vague, et il est impossible en invasion une fois la partie lancée. En mode normal, un joueur mort réapparaît à la fin de la vague avec 50 % de ses PV max et sans bouclier.</li><li><b>Fenêtre de tchat</b> : les notifications (ramassage d’armes, arrivées, morts, niveau…) s’affichent dans une fenêtre en bas à gauche, plus petite, repliable avec le bouton « &lt;&lt; ». On remonte dans l’historique avec la molette de la souris placée sur la fenêtre. L’historique est conservé en entier pour toute la partie (200 messages max en invasion) et effacé à la fin. Chaque ramassage d’arme est annoncé à tous les joueurs. En multijoueur, « Y » ou « Entrée » ouvre la saisie d’un message.</li><li>Animation de rechargement : un anneau doré se remplit dans la barre d’interface, avec le temps restant, pendant le rechargement.</li><li><b>Multijoueur</b> : les boss ont +50 % de PV par joueur supplémentaire (2 joueurs : +50 %, 3 : +100 %…). Un petit encadré « niveau : pseudo » apparaît sous le joueur en jeu, de la couleur de la barre de vie, qui passe maintenant du vert au bleu clair par tranche de 100 PV.</li><li>Caravanier : un nomade toutes les secondes aux extrémités de la carte ; une horde (de chaque côté) toutes les 10 s. Marchand : 2 nomades toutes les 10 s ; ces nomades ne lâchent pas d’armes et ne rapportent que 1 XP.</li><li>La fenêtre de jeu en mode réduit est un peu plus grande (+15 %).</li><li>M4A4 : drop du soldat du désert à 6 %. Les armes au sol ont un contour fin et disparaissent après 3 vagues.</li><li>XM1014 : cadence 2,4/s, dégâts 12 × 6. Le caravanier : 6000 PV, première horde 1 s après son apparition puis toutes les 8 s, avec une seconde horde du côté opposé.</li><li>La Route déserte est renommée « Route 67 ». Le bestiaire indique les pourcentages de drop de chaque zombie.</li><li>Le désert est accessible dès le niveau 10. Miniatures des cartes : celle du désert reprend son visuel, celles des invasions ont une bordure rouge. Zombies et personnages ont un contour noir.</li><li>Le classement n’est affiché que lorsque le jeu est en fenêtre réduite : il est masqué avec « Afficher sur toute la fenêtre » et en plein écran.</li><li>AK47 : perforation +1 (2 zombies). SSG-08 : cadence +1,5 %.</li><li>L’affamé : vitesse de base 160 ; il ralentit toujours quand il n’a pas de cible en vue. Le boss de la Route 67 s’appelle maintenant « Le Caïd ».</li></ul></div><div class="pt"><h3><span>v0.29 · Ajustements</span></h3><ul><li>L’interface de jeu est centrée sur la page.</li><li>Le classement a trois onglets : Zombies tués, Niveau du compte et Record en invasion (un sélecteur par carte invasion apparaîtra automatiquement quand d’autres cartes seront ajoutées).</li><li>Classement des joueurs à côté du jeu (sur la page, pas dans le jeu), disponible en permanence, même en solo et sur l’accueil. Il affiche les stats générales du compte : niveau, total de zombies tués, vague max, boss vaincu. En multijoueur, il classe tous les joueurs de la salle (+ kills de la partie en cours). Il ne décale plus le jeu : celui-ci reste centré. Il se réduit d’un clic.</li><li>Changement d’arme à la molette de la souris (parmi les armes que vous portez).</li><li>Minimap : le chrono de la partie ne dépasse plus du cadre (affiché en haut à droite de la minimap).</li><li>Le jeu mémorise le dernier personnage joué. Case à cocher dans les Options pour désactiver ce comportement.</li><li>En multijoueur, chaque joueur gagne aussi 10 % de l’XP des zombies tués par les autres. Le joueur qui tue le zombie garde 100 %.</li><li>Les menus Personnages / Compétences en jeu sont maintenant de vraies fenêtres : on peut les déplacer (barre de titre), les redimensionner (coin en bas à droite) et les fermer (✕ ou Échap). Position et taille sont mémorisées, et la fenêtre ne recouvre jamais la barre d’interface ni la minimap. On peut continuer à jouer pendant qu’elle est ouverte.</li><li>Le menu Échap et les menus Personnages / Compétences en jeu ne mettent plus la partie en pause : les zombies continuent d’avancer.</li><li>Les icônes Personnages et Compétences restent accessibles pendant toute la partie, mais en consultation seule une fois la vague 1 lancée.</li><li>Solo en mode normal : un compte à rebours de 15 s précède la vague 1, le temps de changer de personnage ou de compétences.</li><li>Personnage et compétences en partie : simples icônes à droite de la barre du bas.</li><li>Un joueur qui arrive en cours de partie apparaît dès le début du temps de transition entre deux vagues.</li><li>Invasion : le chrono de la carte ne démarre qu’au début de la vague 1.</li><li>AK47 : taux de drop porté à 7 %.</li><li>Avant la vague 1, boutons « Personnage » et « Compétences » directement sur la carte.</li><li>Jouer en ligne : tous les joueurs sans code arrivent dans la même salle publique, quelle que soit la carte choisie (la carte est celle de la partie en cours). Le code reste réservé aux salles privées.</li><li>Invasion : délai entre deux vagues de 45 s à partir de la vague 20, et 30 s à partir de la vague 40.</li></ul></div><div class="pt"><h3><span>v0.28 · Difficulté selon le nombre de joueurs</span></h3><ul><li>Le nombre de zombies par vague augmente avec le nombre de joueurs présents (+70 % par joueur supplémentaire), en normal comme en invasion. Le boss n’est pas modifié.</li></ul></div><div class="pt"><h3><span>v0.27 · Mode en ligne</span></h3><ul><li>Nouveau bouton « Jouer en ligne » : tous les joueurs arrivent dans la même salle commune (jusqu’à 10). Le premier arrivé héberge, les autres le rejoignent automatiquement. Un code de salle privée est facultatif.</li><li>Si l’hébergeur quitte, un autre joueur reprend la partie automatiquement.</li><li>Sur Route 67, la partie démarre après 15 s pour laisser le temps de rejoindre. Qui arrive en pleine vague est spectateur jusqu’à la suivante.</li><li>Chacun joue avec sa propre sauvegarde : kills, XP et vague max reviennent à la sienne.</li></ul></div><div class="pt"><h3><span>v0.26 · Préparation du multijoueur</span></h3><ul><li>Le jeu gère maintenant une liste de joueurs (PV, armes, tourelle et bouclier propres à chacun). Rien ne change en solo.</li><li>En partie à plusieurs : notification et marque au sol à la mort d’un joueur, tous les joueurs visibles sur la minimap, et spectateur pour ceux qui rejoignent en cours de vague.</li></ul></div><div class="pt"><h3><span>v0.25 · Export et import de sauvegarde</span></h3><ul><li>Les outils de test (±1 niveau, niveau 50, niveau 1) sont retirés des Options.</li><li>Nouveau dans les Options : exporter sa sauvegarde en code (copier ou télécharger) et l’importer sur un autre navigateur ou un autre PC.</li><li>L’import vérifie le code et demande une confirmation avant de remplacer la sauvegarde.</li></ul></div><div class="pt"><h3><span>v0.24 · Ajustements de l’Invasion</span></h3><ul><li>Pendant l’attente, le joueur peut se promener sur la carte (sans zombies) : l’invasion démarre à l’heure pile sans relancer de partie.</li><li>Après la vague 15, les PV des zombies n’augmentent plus que de 1 % par vague (4 % avant).</li><li>Le délai entre deux vagues passe de 8 s à 3 s en Invasion.</li></ul></div><div class="pt"><h3><span>v0.23 · Mode Invasion</span></h3><ul><li>Nouvelle carte « Route 67 - Invasion » : vagues infinies, sans boss, jusqu’à la mort du joueur. Le tag « Très difficile » de la Route 67 est retiré.</li><li>L’invasion se lance à chaque heure pile, uniquement si le joueur attend sur l’écran d’attente de la carte.</li><li>Une pop-up en haut de l’écran affiche le compte à rebours dans les 10 minutes qui précèdent l’invasion.</li><li>La vague suivante se lance dès que tous les zombies sont morts, ou après 1 minute s’il en reste.</li><li>Difficulté croissante, un peu plus lente qu’en mode normal : +2 zombies par vague, zombies costauds, rôdeurs et brutes qui arrivent plus tard, et PV en hausse après la vague 15.</li></ul></div><div class="pt"><h3><span>v0.22 · Comportement des zombies</span></h3><ul><li>Les zombies avancent toujours vers le joueur, mais 40 % plus lentement qu’avant tant qu’il est hors de leur champ de vision.</li><li>Hors champ de vision, leur trajectoire est plus aléatoire : ils dévient et zigzaguent en approchant.</li><li>Ils retrouvent leur vitesse d’avant quand le joueur entre dans leur champ de vision (cercle de 220 px autour d’eux), ou dès qu’ils sont touchés (alerte définitive).</li></ul></div><div class="pt"><h3><span>v0.21 · Équilibrage des Rangers</span></h3><ul><li>Ranger bleu : 150 PV, vitesse 165, dégâts 30 ; déblocage à 5 000 zombies tués.</li><li>Ranger vert : 250 PV, vitesse 175, dégâts 34.</li><li>Ranger violet : 350 PV, vitesse 185, dégâts 38.</li><li>Ranger rouge : 450 PV, vitesse 195, dégâts 42.</li><li>Ranger jaune : 550 PV, vitesse 205, dégâts 46.</li></ul></div><div class="pt"><h3><span>v0.20 · Rangers et nouvelle catégorie Élite</span></h3><ul><li>Les Rangers se débloquent maintenant en tuant des zombies (cumulé sur le compte) : bleu 1 000, vert 10 000, violet 100 000, rouge 500 000, jaune 1 000 000.</li><li>Nouvelle catégorie « Élite » avec 5 personnages débloqués par le niveau de compte : Soldat (10), Mercenaire (20), Samouraï (30), Berserker (40), Rambo (50).</li></ul></div><div class="pt"><h3><span>v0.19 · Équilibrage des armes</span></h3><ul><li>UZI : cadence 13 tirs/s (12.5 avant), rechargement 0.7 s (1 s avant), précision 84 % (78 % avant).</li><li>AK47 : précision 90 % (88 % avant).</li></ul></div><div class="pt"><h3><span>v0.18 · Tremblement d’écran</span></h3><ul><li>L’écran tremble légèrement quand le joueur tire, selon l’arme : léger (GLOCK 18, UZI), moyen (AK47), fort (DESERT EAGLE, SAWED-OFF, SSG-08).</li><li>Amplitudes : léger 3 px, moyen 4 px, fort 5 px.</li><li>Nouvelle ligne « Tremblement » dans l’Armurerie.</li></ul></div><div class="pt"><h3><span>v0.17 · Balle supplémentaire</span></h3><ul><li>Nouvelle compétence « Balle supplémentaire » aux paliers 2, 5 et 9 : +1 / +2 / +3 / +4 / +5 balles par chargeur (toutes les armes).</li></ul></div><div class="pt"><h3><span>v0.16 · Tirs en traînées</span></h3><ul><li>Les balles s’affichent comme sur le fond de l’accueil : un trait lumineux qui va de l’arme au point d’impact ou à la fin de la portée, puis s’efface aussitôt.</li><li>Le trait reste attaché au joueur quand il se déplace en tirant.</li><li>Les balles sont désormais quasi instantanées (la portée de chaque arme ne change pas).</li></ul></div><div class="pt"><h3><span>v0.15 · Bouton Retour et touche Échap</span></h3><ul><li>Dans chaque menu, le bouton « Retour » est maintenant en haut à gauche et en bas à gauche.</li><li>La touche Échap revient au menu précédent (de la fiche du Bestiaire ou de l’Armurerie vers le Wiki, sinon vers l’accueil).</li></ul></div><div class="pt"><h3><span>v0.14 · PV bonus de niveau</span></h3><ul><li>Les PV bonus gagnés par le niveau de compte ne sont plus affichés à l’accueil : ils sont maintenant dans un coin du menu Compétences.</li></ul></div><div class="pt"><h3><span>v0.13 · Vague max par carte</span></h3><ul><li>Nouvelle fenêtre à droite de l’accueil : vague maximale atteinte sur chaque carte.</li><li>La vague max a quitté la barre de stats centrale.</li></ul></div><div class="pt"><h3><span>v0.12 · Fenêtre des boss vaincus</span></h3><ul><li>Nouvelle fenêtre à gauche de l’accueil qui affiche les boss vaincus.</li><li>L’information « Boss vaincu » a quitté la barre de stats centrale.</li></ul></div><div class="pt"><h3><span>v0.11 · Wiki à débloquer</span></h3><ul><li>Les fiches du Bestiaire et de l’Armurerie doivent être débloquées : il faut avoir vu l’ennemi, l’arme ou l’objet en partie au moins une fois.</li><li>Les fiches non débloquées sont masquées (« ??? »). Un message en partie signale chaque nouvelle entrée.</li><li>Nouvelles fiches dans l’Armurerie : le kit de soin et la boisson énergisante.</li></ul></div><div class="pt"><h3><span>v0.10 · Raccourcis de l’accueil</span></h3><ul><li>« Comment jouer » (❓) et « Options » (⚙️) sont maintenant de petites icônes en bas à gauche de l’accueil.</li></ul></div><div class="pt"><h3><span>v0.9 · Refonte de la tourelle</span></h3><ul><li>La tourelle tire 2 fois plus lentement (un tir toutes les 0,6 s au lieu de 0,3 s).</li><li>Ses dégâts sont doublés : 12 / 18 / 24 / 30 / 36 selon le rang.</li></ul></div><div class="pt"><h3><span>v0.8 · Équilibrage des soins</span></h3><ul><li>Trousses de soin : 6 % par zombie tué (12 % avant), maximum 3 par vague.</li><li>Canettes : 3 % par zombie tué (5 % avant), maximum 3 par vague.</li><li>Les canettes se cumulent : boire plusieurs canettes additionne les durées (7 s chacune).</li></ul></div><div class="pt"><h3><span>v0.7 · Refonte du boss</span></h3><ul><li>Le boss n’invoque plus d’affamés : il invoque des rejetons, des zombies uniques (165 de vitesse, 5 dégâts, 20 PV).</li><li>Un rejeton au contact du joueur le ralentit de 15 %.</li><li>3 rejetons apparaissent autour du boss et 4 aux coins de la carte, toutes les 10 secondes.</li><li>Vitesse du boss : 155.</li><li>Nouvelle fiche « Le rejeton » dans le bestiaire.</li></ul></div><div class="pt"><h3><span>v0.6 · Nouvelles armes et taux de drop</span></h3><ul><li>Ajout du DESERT EAGLE (marcheur, 8 %) : 30 dégâts, 1.9 tir/s, chargeur 7, précision 95 %.</li><li>Ajout de l’UZI (affamé, 10 %) : 6 dégâts, 12.5 tirs/s, chargeur 25, précision 78 %.</li><li>GLOCK 18 : chargeur porté à 20.</li><li>SAWED-OFF : 15 × 6 dégâts, taux de drop 10 %.</li><li>Perforation de 2 zombies pour le DESERT EAGLE et le SAWED-OFF.</li><li>SSG-08 : taux de drop 10 % ; AK47 : 5 %, et la brute ne lâche plus que l’AK47.</li><li>Portées de toutes les armes réduites de 50 %.</li></ul></div><div class="pt"><h3><span>v0.5 · Rework des armes</span></h3><ul><li>Armes renommées : GLOCK 18, AK47, SAWED-OFF, SSG-08, avec un lore adapté.</li><li>Nouvelle statistique de portée (courte, moyenne, longue) : les balles disparaissent hors de portée.</li><li>Perforation du SSG-08 : traverse jusqu’à 3 zombies.</li><li>Les armes se drop sur des zombies précis (indiqué dans le bestiaire).</li></ul></div><div class="pt"><h3><span>v0.4 · Menu Wiki</span></h3><ul><li>Nouveau menu Wiki à l’accueil : Bestiaire et Armurerie.</li><li>L’Armurerie détaille les stats de chaque arme.</li><li>Les stats des personnages n’incluent plus les bonus de compétences ni de niveau.</li></ul></div><div class="pt"><h3><span>v0.3 · Personnages et zombies</span></h3><ul><li>Personnages militaires renommés (Éclaireur, Fantassin, Caporal), avec dégâts fixes et conditions de déblocage.</li><li>Ajout des 5 Rangers (niveaux de compte 10, 20, 30, 40, 50) et des onglets par catégorie.</li><li>Nouveaux zombies : le rôdeur et la brute ; zombies renommés (marcheur, affamé, costaud).</li><li>Les objets au sol ne disparaissent plus.</li></ul></div><div class="pt"><h3><span>v0.2 · Progression</span></h3><ul><li>Arbre de compétences sur 10 paliers (dégâts, PV, soins, bouclier, tourelle…).</li><li>Niveau de compte maximum : 50, courbe d’XP exponentielle, XP fixe par type de zombie.</li><li>Clic sur la barre d’XP pour voir l’XP exact.</li></ul></div><div class="pt"><h3><span>v0.1 · Lancement de Zombiz The Legacy</span></h3><ul><li>Mode vagues : 15 vagues, boss final, drops d’armes, chargeurs par arme.</li><li>Écran d’accueil, choix de la carte, bestiaire, pause, plein écran.</li></ul></div><button class="b2 w" data-s="home">← Retour</button>`;
