on » : vagues infinies, sans boss, jusqu’à la mort du joueur. Le tag « Très difficile » de la Route déserte est retiré.</li><li>L’invasion se lance à chaque heure pile, uniquement si le joueur attend sur l’écran d’attente de la carte.</li><li>Une pop-up en haut de l’écran affiche le compte à rebours dans les 10 minutes qui précèdent l’invasion.</li><li>La vague suivante se lance dès que tous les zombies sont morts, ou après 1 minute s’il en reste.</li><li>Difficulté croissante, un peu plus lente qu’en mode normal : +2 zombies par vague, zombies costauds, rôdeurs et brutes qui arrivent plus tard, et PV en hausse après la vague 15.</li></ul></div><div class="pt"><h3><span>v0.22 · Comportement des zombies</span></h3><ul><li>Les zombies avancent toujours vers le joueur, mais 40 % plus lentement qu’avant tant qu’il est hors de leur champ de vision.</li><li>Hors champ de vision, leur trajectoire est plus aléatoire : ils dévient et zigzaguent en approchant.</li><li>Ils retrouvent leur vitesse d’avant quand le joueur entre dans leur champ de vision (cercle de 220 px autour d’eux), ou dès qu’ils sont touchés (alerte définitive).</li></ul></div><div class="pt"><h3><span>v0.21 · Équilibrage des Rangers</span></h3><ul><li>Ranger bleu : 150 PV, vitesse 165, dégâts 30 ; déblocage à 5 000 zombies tués.</li><li>Ranger vert : 250 PV, vitesse 175, dégâts 34.</li><li>Ranger violet : 350 PV, vitesse 185, dégâts 38.</li><li>Ranger rouge : 450 PV, vitesse 195, dégâts 42.</li><li>Ranger jaune : 550 PV, vitesse 205, dégâts 46.</li></ul></div><div class="pt"><h3><span>v0.20 · Rangers et nouvelle catégorie Élite</span></h3><ul><li>Les Rangers se débloquent maintenant en tuant des zombies (cumulé sur le compte) : bleu 1 000, vert 10 000, violet 100 000, rouge 500 000, jaune 1 000 000.</li><li>Nouvelle catégorie « Élite » avec 5 personnages débloqués par le niveau de compte : Soldat (10), Mercenaire (20), Samouraï (30), Berserker (40), Rambo (50).</li></ul></div><div class="pt"><h3><span>v0.19 ncus</span></h3><ul><li>Nouvelle fenêtre à gauche de l’accueil qui affiche les boss vaincus.</li><li>L’information « Boss vaincu » a quitté la barre de stats centrale.</li></ul></div><div class="pt"><h3><span>v0.11 · Wiki à débloquer</span></h3><ul><li>Les fiches du Bestiaire et de l’Armurerie doivent être débloquées : il faut avoir vu l’ennemi, l’arme ou l’objet en partie au moins une fois.</li><li>Les fiches non débloquées sont masquées (« ??? »). Un message en partie signale chaque nouvelle entrée.</li><li>Nouvelles fiches dans l’Armurerie : le kit de soin et la boisson énergisante.</li></ul></div><div class="pt"><h3><span>v0.10 · Raccourcis de l’accueil</span></h3><ul><li>« Comment jouer » (❓) et « Options » (⚙️) sont maintenant de petites icônes en bas à gauche de l’accueil.</li></ul></div><div class="pt"><h3><span>v0.9 · Refonte de la tourelle</span></h3><ul><li>La tourelle tire 2 fois plus lentement (un tir toutes les 0,6 s au lieu de 0,3 s).</li><li>Ses dégâts sont doublés : 12 / 18 / 24 / 30 / 36 selon le rang.</li></ul></div><div class="pt"><h3><span>v0.8 · Équilibrage des soins</span></h3><ul><li>Trousses de soin : 6 % par zombie tué (12 % avant), maximum 3 par vague.</li><li>Canettes : 3 % par zombie tué (5 % avant), maximum 3 par vague.</li><li>Les canettes se cumulent : boire plusieurs canettes additionne les durées (7 s chacune).</li></ul></div><div class="pt"><h3><span>v0.7 · Refonte du boss</span></h3><ul><li>Le boss n’invoque plus d’affamés : il invoque des rejetons, des zombies uniques (165 de vitesse, 5 dégâts, 20 PV).</li><li>Un rejeton au contact du joueur le ralentit de 15 %.</li><li>3 rejetons apparaissent autour du boss et 4 aux coins de la carte, toutes les 10 secondes.</li><li>Vitesse du boss : 155.</li><li>Nouvelle fiche « Le rejeton » dans le bestiaire.</li></ul></div><div class="pt"><h3><span>v0.6 · Nouvelles armes et taux de drop</span></h3><ul><li>Ajout du DESERT EAGLE (marcheur, 8 %) : 30 dégâts, 1.9 tir/s, chargeur 7, précision 95 %.</li><li>Ajout de l’UZI (affamé, 10 %) : 6 dégâts, 12.5 tirs/s, chargeur 25, précision 78 %.</li><li>GLOCK 18 : chargeur porté à 20.</li><li>SAWED-OFF : 15 × 6 dégâts, taux de drop 10 %.</li><li>Perforation de 2 zombies pour le DESERT EAGLE et le SAWED-OFF.</li><li>SSG-08 : taux de drop 10 % ; AK47 : 5 %, et la brute ne lâche plus que l’AK47.</li><li>Portées de toutes les armes réduites de 50 %.</li></ul></div><div class="pt"><h3><span>v0.5 · Rework des armes</span></h3><ul><li>Armes renommées : GLOCK 18, AK47, SAWED-OFF, SSG-08, avec un lore adapté.</li><li>Nouvelle statistique de portée (courte, moyenne, longue) : les balles disparaissent hors de portée.</li><li>Perforation du SSG-08 : traverse jusqu’à 3 zombies.</li><li>Les armes se drop sur des zombies précis (indiqué dans le bestiaire).</li></ul></div><div class="pt"><h3><span>v0.4 · Menu Wiki</span></h3><ul><li>Nouveau menu Wiki à l’accueil : Bestiaire et Armurerie.</li><li>L’Armurerie détaille les stats de chaque arme.</li><li>Les stats des personnages n’incluent plus les bonus de compétences ni de niveau.</li></ul></div><div class="pt"><h3><span>v0.3 · Personnages et zombies</span></h3><ul><li>Personnages militaires renommés (Éclaireur, Fantassin, Caporal), avec dégâts fixes et conditions de déblocage.</li><li>Ajout des 5 Rangers (niveaux de compte 10, 20, 30, 40, 50) et des onglets par catégorie.</li><li>Nouveaux zombies : le rôdeur et la brute ; zombies renommés (marcheur, affamé, costaud).</li><li>Les objets au sol ne disparaissent plus.</li></ul></div><div class="pt"><h3><span>v0.2 · Progression</span></h3><ul><li>Arbre de compétences sur 10 paliers (dégâts, PV, soins, bouclier, tourelle…).</li><li>Niveau de compte maximum : 50, courbe d’XP exponentielle, XP fixe par type de zombie.</li><li>Clic sur la barre d’XP pour voir l’XP exact.</li></ul></div><div class="pt"><h3><span>v0.1 · Lancement de Zombiz The Legacy</span></h3><ul><li>Mode vagues : 15 vagues, boss final, drops d’armes, chargeurs par arme.</ q.tx=s.x;q.ty=s.y;q.name=s.name;q.ci=s.ci;q.hp=s.hp;q.max=s.max;q.col=s.col;q.alive=s.alive;q.late=s.late;q.cur=s.cur;q.rl=s.rl;q.nrg=s.nrg;q.ne=s.ne;q.sh=s.sh;q.shm=s.shm;q.tu=s.tu;q.tcd=s.tcd;q.tur=s.tur||null;q.hit=s.hit;q.mg=s.mg;q.kills=s.kills;
q.inv=s.iv.map(e=>e?{k:e[0],a:e[1]}:null);q.w=q.inv[q.cur]||q.inv[0];
if(!mine)q.a=s.a;
if(mine){if(!q.alive||Math.hypot(q.x-s.x,q.y-s.y)>150){q.x=s.x;q.y=s.y}if(wk===q.w.k&&q.w.a<wa)g.shk=Math.max(g.shk||0,WP[wk].sk||0)}
ps.push(q);
}
g.ps=ps;g.p=ps.find(q=>q.pid===N.pid)||p;
const zo=new Map(g.z.map(z=>[z.id,z])),zs=[];
for(const e of d.z){let z=zo.get(e[0]);if(!z){const T=ZT[e[3]];z={id:e[0],x:e[1],y:e[2],t:e[3],r:T.r,c:T.c}}z.tx=e[1];z.ty=e[2];z.hp=e[4];z.max=e[5];z.sp=e[6];zs.push(z)}
g.z=zs;
g.d=d.d.map(e=>({k:e[0],x:e[1],y:e[2],a:e[3],t:20}));
g.marks=d.mk;
const byp=new Map(g.ps.map(q=>[q.pid,q]));
for(const e of d.tr)if(e.id>N.mx.tr){N.mx.tr=e.id;g.tr.push({own:e.o?byp.get(e.o):null,ox0:e.ox0,oy0:e.oy0,x1:e.x1,y1:e.y1,x2:e.x2,y2:e.y2,t:.08})}
for(const e of d.fx)if(e.id>N.mx.fx){N.mx.fx=e.id;g.fx.push({x:e.x,y:e.y,t:e.t,s:e.s})}
for(const e of d.bl)if(e[0]>N.mx.bl){N.mx.bl=e[0];g.bl.push({x:e[1],y:e[2],r:e[3]});if(g.bl.length>200)g.bl.shift()}
for(const e of d.lg)if(e.id>N.mx.lg){N.mx.lg=e.id;g.log.push({t:e.t,c:e.c,s:e.s})}
}
function cupd(dt){
const g=G,p=g.p,N=NET,ps=g.ps;
g.shk=Math.max(0,(g.shk||0)-dt*30);
const ui=ov.style.display!='none',mig=N.role=='mig';
const dx=ui?0:(K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0),dy=ui?0:(K.KeyS||K.ArrowDown?1:0)-(K.KeyW||K.ArrowUp?1:0),mv=!!(dx||dy);
if(p.alive&&!mig&&mv){const l=Math.hypot(dx,dy),sp=p.sp*(p.nrg>0?p.ne:1);p.x=cl(p.x+dx/l*sp*dt,12,WW-12);p.y=cl(p.y+dy/l*sp*dt,12,WH-12)}
for(const q of ps){if(q.tx==null)continue;const k=q===p?Math.min(1,dt*(mv?.6:4)):Math.min(1,dt*14);q.x+=(q.tx-q.x)*k;q.y+=(q.ty-q.y)*k}
for(const z of g.z){z.x+=(z.tx-z.x)*Math.min(1,dt*14);z.y+=(z.ty-z.y)*Math.min(1,dt*14)}
{const cam=p.alive?p:(ps.find(q=>q.alive)||p);g.cx=cl(cam.x-W/2,0,WW-W);g.cy=cl(cam.y-H/2,0,WH-H)}
const ax=M.x+g.cx,ay=M.y+g.cy;
if(p.alive)p.a=Math.atan2(ay-p.y,ax-p.x);
if(!mig){N.ia=(N.ia||0)+dt;if(N.ia>=.033){N.ia=0;nsend(N.c,{t:'in',dx,dy,ax:Math.round(ax),ay:Math.round(ay),f:!ui&&M.down?1:0,r:!ui&&K.KeyR?1:0})}}
g.mt-=dt;
g.tr=g.tr.filter(q=>(q.t-=dt)>0);
for(const f of g.fx){f.t-=dt;f.y-=30*dt}g.fx=g.fx.filter(f=>f.t>0);
for(const l of g.log)l.t-=dt;g.log=g.log.filter(l=>l.t>0);
{let nw=false;const seeIt=k=>{if(!S.seen[k]){S.seen[k]=1;nw=true;g.log.push({t:5,s:'Wiki : nouvelle entrée débloquée — '+wnm(k)})}};
for(const z of g.z)if(!S.seen[z.t]&&z.x>g.cx-z.r&&z.x<g.cx+W+z.r&&z.y>g.cy-z.r&&z.y<g.cy+H+z.r)seeIt(z.t);
for(const d of g.d)if(!S.seen[d.k]&&d.x>g.cx&&d.x<g.cx+W&&d.y>g.cy&&d.y<g.cy+H)seeIt(d.k);
if(nw)save()}
}
function netQuit(){
const N=NET;
if(N&&N.role=='client'&&N.c&&N.c.open){N.leaving=true;nsend(N.c,{t:'bye'});setTimeout(finishQuit,700)}
else finishQuit();
}
function finishQuit(){const g=G;if(g&&g.st=='end')return;save();netLeave();if(g)g.st='end';note='';menu('home')}
// L'hébergeur continue à faire tourner la partie même si son onglet est masqué (rattrapage ~2 fois par seconde)
setInterval(()=>{
if(!document.hidden){bgLast=0;return}
if(!G||G.st!='play'||!NET||NET.role!='host')return;
const n=performance.now(),el=cl((n-(bgLast||n-500))/1000,0,1.2);bgLast=n;
for(let t=0;t<el;t+=1/30)if(G&&G.st=='play')upd(1/30);
netTick(1);
},500);
let last=0;
function loop(t){
const dt=Math.min((t-last)/1000,.05);last=t;
if(G&&G.st=='play'){if(G.net&&NET&&(NET.role=='client'||NET.role=='mig'))cupd(dt);else{upd(dt);if(G.net)netTick(dt)}}
pb.style.display=G&&G.st=='play'?'block':'none';
{const now=Date.now(),rem=nextInv()-now,inInv=G&&G.inv&&(G.st=='play'||G.st=='pause');
ov.querySelectorAll('.mcd').forEach(q=>q.textContent=fmtT(rem));
if(rem<=600000&&!inInv){invp.style.display='block';invp.textContent='⚔ Invasion — Route déserte dans '+fmtT(rem)+(ov.style.display!='none'?' · cliquez pour rejoindre':'')}else invp.style.display='none'}{const sh=ov.style.display!='none'&&ov.className=='home'&&scr=='home';pnb.style.display=sh?'block':'none';hwb.style.display=opb.style.display=sh?'block':'none'}draw();requestAnimationFrame(loop);
}
addEventListener('keydown',e=>{
if(e.target&&(e.target.tagName=='TEXTAREA'||e.target.tagName=='INPUT'))return;
K[e.code]=true;
if(e.code=='KeyE')pick();
if(e.code=='Escape'&&ov.style.display!='none'&&ov.className=='home'&&scr!='home'){menu(backOf(scr));return}
if((e.code=='Escape'||e.code=='KeyP')&&G){const mo=G.net&&ov.style.display!='none';if(G.st=='play'&&!mo)pause();else if(G.st=='pause'||mo)resume()}
if(e.code=='KeyF')fs();
if(e.code=='KeyT')placeTur();
if(e.code=='Enter'&&scr=='home'&&(!G||G.st=='end')){const b=document.getElementById('bplay');if(b)b.click()}
if(G&&G.st=='play'&&/^Digit[1-3]$/.test(e.code)){const i=+e.code[5]-1;if(G.net&&NET&&NET.role=='client')nsend(NET.c,{t:'ev',k:'sw',i});else swap(G.p,i)}
if(G&&G.st=='play'&&e.code.startsWith('Arrow'))e.preventDefault();
});
addEventListener('keyup',e=>{K[e.code]=false});
cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();M.x=(e.clientX-r.left)*W/r.width;M.y=(e.clientY-r.top)*H/r.height});
cv.addEventListener('mousedown',e=>{e.preventDefault();const rc=cv.getBoundingClientRect(),mx=(e.clientX-rc.left)*W/rc.width,my=(e.clientY-rc.top)*H/rc.height;if(G&&G.st=='play'&&mx>=64&&mx<=254&&my>=H-24&&my<=H-4){xpd=!xpd;return}M.down=true});
addEventListener('mouseup',()=>{M.down=false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
const pb=document.getElementById('pb'),bd=document.body;
pb.onclick=()=>{pb.blur();pause()};
const invp=document.getElementById('invp');invp.onclick=()=>{if(ov.style.display!='none')menu('maps')};
const pnb=document.getElementById('pnb'),hwb=document.getElementById('hwb'),opb=document.getElementById('opb');pnb.onclick=()=>{pnb.blur();menu('patch')};hwb.onclick=()=>{hwb.blur();menu('how')};opb.onclick=()=>{opb.blur();menu('opt')};
function fs(){const d=document;if(d.fullscreenElement){d.exitFullscreen();return}if(d.documentElement.requestFullscreen)d.documentElement.requestFullscreen().catch(()=>bd.classList.add('fit'));else bd.classList.add('fit')}
document.addEventListener('fullscreenchange',()=>bd.classList.toggle('fs',!!document.fullscreenElement));
function pause(){if(!G||G.st!='play')return;if(!G.net)G.st='pause';for(const k in K)K[k]=false;M.down=false;pmenu(false)}
function resume(){if(G&&G.st=='pause')G.st='play';ov.style.display='none'}
function pmenu(o){
ov.style.display='flex';ov.className='';
ov.innerHTML=o?`<div class="pn"><h1>Options</h1><button class="b" id="o1">${bd.classList.contains('fit')?'✔ ':''}Afficher sur toute la fenêtre</button><button class="b" id="o2">Plein écran (touche F)</button><button class="b" id="o3">Retour</button></div>`:`<div class="pn"><h1>Pause</h1><button class="b" id="p1">Reprendre</button><button class="b" id="p2">Options</button><button class="b" id="p3">Quitter la partie</button><p class="h">Échap ou P : pause · F : plein écran</p></div>`;
const q=id=>document.getElementById(id);
if(o){q('o1').onclick=()=>{bd.classList.toggle('fit');pmenu(true)};q('o2').onclick=()=>fs();q('o3').onclick=()=>pmenu(false)}
else{q('p1').onclick=resume;q('p2').onclick=()=>pmenu(true);q('p3').onclick=()=>{if(G.net){netQuit();return}G.st='end';save();note='';menu()}}
}
menu();requestAnimationFrame(loop);
